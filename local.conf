<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Ignore WOFF web fonts.
       fontconfig 2.15 mis-parses the OpenDyslexic *.woff files installed by
       fonts-opendyslexic: it reports bogus family names (the same file
       answers as "Inter", "Arimo" and "sans-serif") and hands Qt a broken
       FcCharSet. Qt 5.15 then segfaults in FcCharSetHasChar() while shaping
       text, which crashed QuiteRSS/NotQuiteRSS on Wayland.
       The package also ships proper .otf files under
       /usr/share/fonts/opentype/opendyslexic, so nothing is lost. -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/woff/*/*.woff</glob>
      <glob>/usr/share/fonts/woff/*/*.ttf</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
